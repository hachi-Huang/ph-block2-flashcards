/* The face grows with its contents; there is no clipped, fixed-height back. */
.flash-filters{grid-template-columns:repeat(3,minmax(0,1fr))}
.flash-wrap{max-width:780px;margin:auto}
.flash-meta{display:flex;align-items:center;justify-content:space-between;min-height:42px;margin:0 2px 10px;font-size:12px;color:var(--muted)}
.flash-face{width:100%;border:1px solid #cbd5d8;border-radius:20px;background:#fff;box-shadow:0 12px 40px #172f3d0b;color:var(--ink);overflow-wrap:anywhere}
.card-front{min-height:340px;display:flex;align-items:center;justify-content:center;padding:48px 36px;position:relative;transition:border-color .15s,box-shadow .15s}
.card-front:before{content:'';position:absolute;top:24px;left:calc(50% - 18px);width:36px;height:3px;border-radius:2px;background:#bacdd1}
.card-front:hover{border-color:#75939f;box-shadow:0 12px 40px #172f3d15}
.flash-name{font-size:clamp(26px,4vw,37px);line-height:1.45;letter-spacing:-.02em;font-weight:700}
.card-back{padding:30px 36px 18px;min-height:340px;cursor:pointer}
.card-back h1{font-size:25px;letter-spacing:0;line-height:1.5;margin-bottom:20px}
.card-back .eyebrow{margin-bottom:7px;color:var(--muted)}
.fact-list{margin:0;font-size:16px;font-weight:500;line-height:1.8}
.fact-group{display:grid;grid-template-columns:115px minmax(0,1fr);gap:16px;padding:17px 0;border-top:1px solid var(--line)}
.fact-group dt{font-size:12px;font-weight:700;color:#516570;padding-top:3px}
.fact-group dd{margin:0}.fact-group ul{margin:0;padding-left:19px}.fact-group li+li{margin-top:9px}
.fact-group small{display:block;font-size:11px;font-weight:400;margin-top:7px}
.card-back .source-details{cursor:auto}.back-flip{display:flex;justify-content:center;margin-top:15px}
.flip-hint{font-size:12px;color:var(--muted);text-align:center;margin:13px 0 20px}
.rating-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.card-navigation{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.card-navigation button{min-width:125px}.list-switches{display:inline-flex;margin-bottom:18px}
.list-switches button{min-height:42px}.drug-card h2{font-weight:700}.source-g,.source-r{font-weight:800}
.button-row{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:24px}

 .flash-filters{grid-template-columns:1fr}.field{font-size:13px}.field select{min-height:48px}
 .setup{padding:20px 17px}.start-row{flex-direction:column;align-items:stretch;gap:13px}.primary{width:100%}
 .resume{align-items:center;padding:14px;gap:10px}.resume .secondary{flex-shrink:0;min-height:44px;font-size:12px;padding:9px 12px}
 .quiz-top{font-size:12px;gap:8px}.quiz-top>span:first-child{flex:1;min-width:0}.quiz-top>span:nth-child(2){white-space:nowrap}.quiz-top .quiet{padding:8px}
 .flash-wrap .progress-track{margin-bottom:12px}.flash-meta{margin-bottom:5px}
 .card-front{min-height:250px;min-height:clamp(210px,39svh,340px);padding:38px 24px;border-radius:16px}
 .flash-name{font-size:clamp(24px,5.7vw,32px);line-height:1.5}
 .card-back{min-height:250px;border-radius:16px;padding:24px 20px 14px}
 .card-back h1{font-size:23px}.fact-group{grid-template-columns:1fr;gap:5px;padding:15px 0}
 .fact-list{font-size:16px}.fact-group dt{font-size:13px;padding:0}.fact-group small{font-size:12px}
 .source-grid{font-size:14px}.source-details summary{font-size:14px}.back-flip .quiet{font-size:14px}
 .flip-hint{margin:12px 0;font-size:12px}
 .study-controls{position:sticky;bottom:calc(var(--mobile-nav) + env(safe-area-inset-bottom));z-index:15;background:var(--paper);padding:10px 0 12px;border-top:1px solid var(--line);box-shadow:0 -10px 20px var(--paper)}
 .rating-actions{margin:0 0 9px;gap:10px}.rating-actions button{font-size:14px;padding:11px 8px}
 .card-navigation{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
 .card-navigation button{width:100%;min-width:0;min-height:48px;padding:11px 8px}
 .studying .footer{display:none}.studying .main{padding-bottom:0}.flash-wrap .keyboard-hint{display:none}
 .toolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.toolbar select,.toolbar input{width:100%;max-width:none;min-height:48px}
 .drug-grid,.memory-grid{grid-template-columns:minmax(0,1fr)}.drug-card .secondary{min-height:44px}
 .drug-aliases,.drug-progress{font-size:13px}.memory-card p{font-size:14px}.limit{font-size:12px}
 .page-intro{align-items:flex-start;flex-direction:column;gap:15px}.page-intro h1{font-size:27px}
 .footer{align-items:stretch;flex-direction:column;gap:12px;font-size:12px}
 .footer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-actions a,.footer-actions button{font-size:12px;min-height:44px;justify-content:center;border:1px solid var(--line);border-radius:8px;padding:7px}
 .toast{bottom:calc(var(--mobile-nav) + env(safe-area-inset-bottom) + 12px)}
}
@media(min-width:721px) and (max-width:1024px){
 .hero{grid-template-columns:1fr 1fr;gap:25px}.hero h1{font-size:35px}
 .flash-wrap{max-width:760px}.card-front{min-height:310px}
 .flash-name{font-size:32px}.flash-filters{grid-template-columns:repeat(3,minmax(0,1fr))}
 .memory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .footer{flex-wrap:wrap}.footer-actions{gap:14px}
}
@media(max-width:380px){.nav button{font-size:11px}.chapter{padding:15px 11px}.chapter.selected{padding:14.5px 10.5px}.chapter strong{font-size:14px}.chapter .sub{font-size:10px}.chapter .completion{font-size:10px}.resume{flex-wrap:wrap}.resume .secondary{width:100%}.fact-list{font-size:16px}}
@media(orientation:landscape) and (max-height:540px) and (pointer:coarse){
 .topbar{height:56px;min-height:0;padding:9px 0}.main{padding-top:16px}
 .card-front{min-height:155px;padding:28px}.flash-name{font-size:28px}.card-front:before{top:15px}
 .flash-meta{margin-bottom:0}.quiz-top{margin-bottom:5px}.flip-hint{margin:8px 0}
}

":11,"row":3,"facet":"特徵","prompt":"Losartan／Valsartan 的直接作用位置為何？","answer":"AT1 receptor","explanation":"-sartan 是 ARB；-pril 是 ACEI。兩組仍須注意高血鉀與孕期禁用。","type":"choice","choices":["AT1 receptor","ACE enzyme","Renin enzyme","Mineralocorticoid receptor"],"aliases":[],"memory":"raas","marked":true,"drug_ids":[]},{"id":"q023","chapter":"1","section":12,"row":4,"facet":"機轉","prompt":"Zileuton 與 Montelukast 的機轉配對為何？","answer":"Zileuton 抑 5-LO；Montelukast 阻 CysLT1","explanation":"Zileuton 阻合成；-lukast 組阻受體。皆用於控制／預防，不能取代快速救援藥。","type":"choice","choices":["Zileuton 抑 5-LO；Montelukast 阻 CysLT1","Zileuton 阻 CysLT1；Montelukast 抑 5-LO","兩者皆不可逆抑 COX-1","兩者皆活化 β2"],"aliases":[],"memory":"leukotriene","marked":false,"drug_ids":[]},{"id":"q024","chapter":"1","section":13,"row":0,"facet":"特徵","prompt":"需要維持新生兒動脈導管開放時，哪個配對正確？","answer":"Alprostadil：維持開放","explanation":"Alprostadil 為 PGE1；Indomethacin／Ibuprofen 減少 PG，方向是關閉 PDA。","type":"choice","choices":["Alprostadil：維持開放","Indomethacin：維持開放","Ibuprofen：維持開放","Celecoxib：直接補充 PGE1"],"aliases":[],"memory":"pda","marked":true,"drug_ids":[]},{"id":"q025","chapter":"1","section":13,"row":4,"facet":"副作用","prompt":"Latanoprost／Bimatoprost／Travoprost 的特色是哪項？","answer":"改善房水流出，可能增加虹膜棕色色素","explanation":"本表的眼科 -prost 組降低眼壓；Bimatoprost 另有促睫毛生長用途。","type":"choice","choices":["改善房水流出，可能增加虹膜棕色色素","阻斷房水流出，造成瞳孔永久縮小","治肺高壓，主要造成聽力損傷","抑制胃酸，主要造成男性女乳"],"aliases":[],"memory":null,"marked":true,"drug_ids":[]},{"id":"q026","chapter":"2","section":0,"row":1,"facet":"機轉","prompt":"Glucocorticoid 與 GR 結合後，主要如何產生作用？","answer":"受體活化入核，調控基因轉錄","explanation":"GR 是細胞內受體，與 Hsp90 的未活化複合體解離後，參與轉錄調控。","type":"choice","choices":["受體活化入核，調控基因轉錄","直接阻斷細菌 PBP","活化細胞膜 Nicotinic receptor","不可逆乙醯化 COX"],"aliases":[],"memory":null,"marked":false,"drug_ids":[]},{"id":"q027","chapter":"2","section":0,"row":0,"facet":"特徵","prompt":"長期高劑量 Glucocorticoid 不可突然停藥，主因為何？","answer":"HPA 軸受抑，可能急性腎上腺不足","explanation":"外給 Steroid 負回饋抑 CRH／ACTH；內生性 Cortisol 供應的恢復需要時間。","type":"choice","choices":["HPA 軸受抑，可能急性腎上腺不足","藥物已使血小板無法再造 COX","會立即發生肝臟潛伏瘧疾","腎臟無法把 Cortisol 變成 Aldosterone"],"aliases":[],"memory":null,"marked":true,"drug_ids":[]},{"id":"q028","chapter":"2","section":0,"row":1,"facet":"特徵","prompt":"使用 Glucocorticoid 後血中 Neutrophils 上升，應如何解讀？","answer":"不代表抗感染能力增強，組織移行仍受抑制","explanation":"血中數量與組織發炎功能要分開；類固醇整體仍有免疫抑制作用。","type":"choice","choices":["不代表抗感染能力增強，組織移行仍受抑制","證明免疫抑制已解除","代表 Lymphocytes 必然同步上升","說明藥物直接殺死病原"],"aliases":[],"memory":null,"marked":false,"drug_ids":[]},{"id":"q029","chapter":"2","section":0,"row":4,"facet":"機轉","prompt":"腎臟中把 Cortisol 轉成 Cortisone、保護 MR 的酵素是？","answer":"11β-HSD2","explanation":"11β-HSD2 降低 Cortisol 對 MR 的不當刺激；11β-HSD1 可反向再活化。","type":"choice","choices":["11β-HSD2","11β-HSD1","21-hydroxylase","CYP17"],"aliases":[],"memory":null,"marked":false,"drug_ids":[],"legacy_fill":true},{"id":"q030","chapter":"2","section":1,"row":4,"facet":"特徵","prompt":"哪個藥具有很強的 Mineralocorticoid 作用，可補足 Aldosterone？","answer":"Fludrocortisone","explanation":"Fludrocortisone 的留鹽效力特別強；Dexamethasone／Betamethasone 幾乎無留鹽作用。","type":"choice","choices":["Fludrocortisone","Dexamethasone","Triamcinolone","Betamethasone"],"aliases":[],"memory":"steroid","marked":true,"drug_ids":[]},{"id":"q031","chapter":"2","section":1,"row":3,"facet":"特徵","prompt":"Dexamethasone／Betamethasone 的特色為何？","answer":"強、長效 Glucocorticoid，幾乎無留鹽作用","explanation":"強抗發炎效力不等於能充分取代 Aldosterone。","type":"choice","choices":["強、長效 Glucocorticoid，幾乎無留鹽作用","主要為強效 MR agonist","無法穿過胎盤","只在胃腸道局部作用"],"aliases":[],"memory":"steroid","marked":false,"drug_ids":[]},{"id":"q032","chapter":"2","section":2,"row":0,"facet":"特徵","prompt":"Addison disease 同時缺 Cortisol 與 Aldosterone，哪組補充最合理？","answer":"Hydrocortisone＋Fludrocortisone","explanation":"分別補 Glucocorticoid 與 Mineralocorticoid；後三組反而含抑制或拮抗作用。","type":"choice","choices":["Hydrocortisone＋Fludrocortisone","Dexamethasone＋Mifepristone","Spironolactone＋Eplerenone","Metyrapone＋Ketoconazole"],"aliases":[],"memory":"steroid","marked":true,"drug_ids":[]},{"id":"q033","chapter":"2","section":2,"row":1,"facet":"機轉","prompt":"先天性腎上腺增生最常見的是哪個 hydroxylase 缺乏？","answer":"21","explanation":"Cortisol↓ → ACTH↑ → 腎上腺增生及 Androgen 過多。","type":"choice","choices":["21","11β","17α","18"],"aliases":[],"memory":null,"marked":true,"drug_ids":[],"legacy_fill":true},{"id":"q034","chapter":"2","section":2,"row":3,"facet":"特徵","prompt":"促胎兒肺成熟選 Dexamethasone／Betamethasone 的重要藥理原因為何？","answer":"較能通過胎盤且較不被胎盤 11β-HSD2 去活化","explanation":"Cortisol 易被胎盤轉成低活性 Cortisone，與這兩種藥比較。","type":"choice","choices":["較能通過胎盤且較不被胎盤 11β-HSD2 去活化","完全不進入胎兒血中","具有最強的 Aldosterone 作用","只阻斷母體 GR 而不活化 GR"],"aliases":[],"memory":null,"marked":true,"drug_ids":[]},{"id":"q035","chapter":"2","section":2,"row":4,"facet":"副作用","prompt":"哪組最符合長期 Glucocorticoid 的共同不良反應？","answer":"骨鬆、高血糖、感染風險上升","explanation":"蛋白分解、鈣吸收下降及免疫抑制，連結典型長期副作用。","type":"choice","choices":["骨鬆、高血糖、感染風險上升","低血糖、骨密度增加、免疫增強","只有低血鉀，完全沒有代謝影響","僅有局部虹膜色素增加"],"aliases":[],"memory":null,"marked":true,"drug_ids":[]},{"id":"q036","chapter":"2","section":3,"row":2,"facet":"機轉","prompt":"Metyrapone 主要抑制哪個 hydroxylase？","answer":"11β","explanation":"阻 Cortisol 合成；Etomidate 也可抑此步驟。","type":"choice","choices":["11β","21","17α","18"],"aliases":[],"memory":null,"marked":false,"drug_ids":[],"legacy_fill":true},{"id":"q037","chapter":"2","section":3,"row":1,"facet":"副作用","prompt":"同時有抗黴菌與抑 Steroid 合成作用，並須留意肝毒性／CYP 交互作用的是？","answer":"Ketoconazole","explanation":"Ketoconazole 抑多種 Steroid 合成酵素，與 Azole 的 CYP／肝毒性一起記。","type":"choice","choices":["Ketoconazole","Fludrocortisone","Eplerenone","Hydrocortisone"],"aliases":[],"memory":null,"marked":false,"drug_ids":[]},{"id":"q038","chapter":"2","section":3,"row":4,"facet":"機轉","prompt":"Mitotane 與 Metyrapone 的機轉差別為何？","answer":"Mitotane 毒殺腎上腺皮質細胞；Metyrapone 抑合成酵素","explanation":"細胞毒殺、酵素抑制、受體拮抗是三種不同位置。","type":"choice","choices":["Mitotane 毒殺腎上腺皮質細胞；Metyrapone 抑合成酵素","兩者皆直接阻 GR","Mitotane 補 MR；Metyrapone 補 GR","兩者皆為 CYP21 活化劑"],"aliases":[],"memory":null,"marked":false,"drug_ids":[]},{"id":"q039","chapter":"2","section":4,"row":0,"facet":"機轉","prompt":"Mifepristone（RU-486）的直接作用是？","answer":"GR＋PR antagonist","explanation":"阻斷受體作用，並非抑 Steroid 生合成酵素；PR blockade 亦連結藥物流產。","type":"choice","choices":["GR＋PR antagonist","11β-hydroxylase inhibitor","MR agonist","ACTH receptor agonist"],"aliases":[],"memory":null,"marked":false,"drug_ids":[]},{"id":"q040","chapter":"2","section":4,"row":1,"facet":"副作用","prompt":"Spironolactone 相較 Eplerenone 較容易造成男性女乳，原因是？","answer":"另有 Androgen receptor antagonist 作用","explanation":"兩者皆需留意高血鉀；Eplerenone 較選擇性阻 MR，性荷爾蒙副作用較少。","type":"choice","choices":["另有 Androgen receptor antagonist 作用","額外活化 Androgen receptor","只抑 CYP21","完全不作用於 MR"],"aliases":[],"memory":null,"marked":true,"drug_ids":[]},{"id":"q041","chapter":"2","section":4,"row":3,"facet":"特徵","prompt":"哪個 MR antagonist 屬非 Steroid 類？","answer":"Finerenone","explanation":"Finerenone 是非 Steroid 類 MR antagonist；Fludrocortisone 反而是強 Mineralocorticoid。","type":"choice","choices":["Finerenone","Spironolactone","Fludrocortisone","Dexamethasone"],"aliases":[],"memory":null,"marked":false,"drug_ids":[]},{"id":"q042","chapter":"3","section":1,"row":0,"facet":"機轉","prompt":"β-lactams 的細胞壁靶點通常簡稱為何？","answer":"PBP","explanation":"抑 Transpeptidase，阻斷 Peptidoglycan 交聯；不是 Vancomycin 的 D-Ala-D-Ala binding。","type":"choice","choices":["PBP","MurA","DHFR","Topo IV"],"aliases":[],"memory":"wall","marked":false,"drug_ids":[],"legacy_fill":true},{"id":"q043","chapter":"3","section":1,"row":2,"facet":"排除途徑","prompt":"Nafcillin 的主要排除途徑是？","answer":"膽汁","explanation":"Nafcillin 是多數 Penicillins 主要腎排的例外。","type":"choice","choices":["膽汁","尿液／腎","呼吸道","汗液"],"aliases":[],"memory":"elimination","marked":false,"drug_ids":[],"legacy_fill":true},{"id":"q044","chapter":"3","section":1,"row":2,"facet":"特徵","prompt":"Nafcillin／Oxacillin 對 MRSA 不可靠的關鍵原因是？","answer":"MRSA 的 PBP 改變","explanation":"耐 Staphylococcal β-lactamase 不代表能克服改變的 PBP。","type":"choice","choices":["MRSA 的 PBP 改變","MRSA 只  與 B cells 都會受影響，範圍較廣","explanation":"CD52 也存在其他免疫細胞；CD20 較偏 B cell 標記。","type":"choice","choices":["T 與 B cells 都會受影響，範圍較廣","只影響紅血球，完全不影響淋巴球","只阻 IL-6 ligand","只影響 B cells 且必與 CD20 完全一樣"],"aliases":[],"memory":"cd","marked":false,"drug_ids":[]},{"id":"q176","chapter":"7","section":5,"row":4,"facet":"機轉","prompt":"Belimumab 中和哪個 B cell survival factor？","answer":"BAFF","explanation":"Anti-BAFF 與 Anti-CD20 是兩個不同靶點。","type":"choice","choices":["BAFF","TNFα","IL-6","C5"],"aliases":[],"memory":null,"marked":false,"drug_ids":[],"legacy_fill":true},{"id":"q177","chapter":"7","section":6,"row":0,"facet":"機轉","prompt":"Abatacept 與 Ipilimumab 的作用方向差別為何？","answer":"前者阻共刺激抑 T cell；後者解除 CTLA-4 抑制","explanation":"Abatacept 是 CTLA-4–Ig，占 CD80／86；Ipilimumab 是 Anti-CTLA-4，解除負向調控。","type":"choice","choices":["前者阻共刺激抑 T cell；後者解除 CTLA-4 抑制","兩者皆只解除 PD-1 煞車","兩者皆直接毒殺 B cells","前者促 T cell；後者必然抑 T cell"],"aliases":[],"memory":"checkpoint","marked":false,"drug_ids":[]},{"id":"q178","chapter":"7","section":6,"row":1,"facet":"副作用","prompt":"Natalizumab 阻免疫細胞跨 BBB，需特別留意哪個嚴重風險？","answer":"PML／機會性感染","explanation":"Anti-α4 integrin 降低黏附／進入 CNS，亦減少中樞免疫監視。","type":"choice","choices":["PML／機會性感染","出血性膀胱炎","Reye syndrome","Gray baby syndrome"],"aliases":[],"memory":null,"marked":false,"drug_ids":[]},{"id":"q179","chapter":"7","section":6,"row":4,"facet":"機轉","prompt":"Eculizumab 的補體靶點是？","answer":"C5","explanation":"阻 C5 → C5a／C5b，減少 MAC；須留意 Meningococcal infection 風險。","type":"choice","choices":["C5","C3","C1s","C5aR1"],"aliases":[],"memory":"complement","marked":false,"drug_ids":[],"legacy_fill":true},{"id":"q180","chapter":"7","section":6,"row":8,"facet":"機轉","prompt":"Avacopan 與 Eculizumab 的直接靶點差別為何？","answer":"Avacopan：C5aR1；Eculizumab：C5","explanation":"C5a receptor blockade 不能當成 Anti-C5 的同義詞。","type":"choice","choices":["Avacopan：C5aR1；Eculizumab：C5","兩者皆 C3","Avacopan：C1s；Eculizumab：CD20","兩者皆 Anti-PD-L1"],"aliases":[],"memory":"complement","marked":false,"drug_ids":[]},{"id":"q181","chap ,0]],"facet":"機轉","prompt":"Aldosterone作為 Ang II 的下游，電解質／水分方向為何？","answer":"留鈉水、排 K⁺／H⁺","explanation":"Aldosterone：留鈉水、排 K⁺／H⁺。","type":"choice","choices":["直接使所有凝血停止","只負責降低腸腔 cyst","留鈉水、排 K⁺／H⁺","排鈉水、留 K⁺／H⁺"],"aliases":[],"memory":null,"marked":false,"drug_ids":["d1-aldosterone"],"learning_point":"aldo_raas_effect"},{"id":"d4-rifampin--rifampin_gout","chapter":"4","section":4,"row":2,"sources":[["4",4,2]],"facet":"特徵","prompt":"Rifampin在 Probenecid 的交互作用對照中，涉及哪個路徑？","answer":"膽汁排出路徑","explanation":"Rifampin：膽汁排出路徑。","type":"choice","choices":["腎上腺 GR 受體","膽汁排出路徑","病毒 Thymidine kinase","寄生蟲 β-tubulin"],"aliases":[],"memory":null,"marked":true,"drug_ids":["d4-rifampin"],"learning_point":"rifampin_gout"},{"id":"d4-rifampin--rifampin_proben_compare","chapter":"4","section":4,"row":2,"sources":[["4",4,2]],"facet":"特徵","prompt":"Rifampin與 Penicillin 的腎排互動比較，重點為何？","answer":"不能把此處膽汁路徑互動一律寫成 Penicillin 的腎小管分泌","explanation":"Rifampin：不能把此處膽汁路徑互動一律寫成 Penicillin 的腎小管分泌。","type":"choice","choices":["兩者都只由病毒酵素活化","兩者完全無排除途徑差異","兩者皆只抑尿酸生成","不能把此處膽汁路徑互動一律寫成 Penicillin 的腎小管分泌"],"aliases":[],"memory":null,"marked":true,"drug_ids":["d4-rifampin"],"learning_point":"rifampin_proben_compare"},{"id":"d5-abatacept--ctla_ig","chapter":"5","section":6,"row":0,"sources":[["7",6,0],["5",10,3]],"facet":"機轉","prompt":"Abatacept以 CTLA-4–Ig Fc fusion 直接結合何者？","answer":"APC 的 CD80／86（B7）","explanation":"Abatacept：APC 的 CD80／86（B7）。Abatacept 占 B7、減少共刺激；Ipilimumab 阻 CTLA-4、解除免疫煞車。","type":"choice","choices":["T cell 的 PD-1","B cell 的 CD20","補體 C5","APC 的 CD80／86（B7）"],"aliases":[],"memory":"checkpoint","marked":true,"drug_ids":["d5-abatacept"],"learning_point":"ctla_ig"},{"id":"d5-abatacept--costim_off","chapter":"5","section":6,"row":0,"sources":[["7",6,0],["5",10,3]],"facet":"特徵","prompt":"Abatacept對 T cell 共刺激的方向為何？","answer":"競爭 CD28 共刺激；缺 Signal 2 可成 Anergy","explanation":"Abatacept：競爭 CD28 共刺激；缺 Signal 2 可成 Anergy。","type":"choice","choices":["直接補 IL-2 以促增殖","競爭 CD28 共刺激；缺 Signal 2 可成 Anergy","解除 CTLA-4 煞車，使 T cell 活化↑","增加 B7 與 CD28 的接合"],"aliases":[],"memory":"checkpoint","marked":true,"drug_ids":["d5-abatacept"],"learning_point":"costim_off"},{"id":"d6-colchicine--colchi_worm_compare","chapter":"6","section":2,"row":1,"sources":[["6",2,1]],"facet":"機轉","prompt":"Colchicine在寄生蟲微管比較中，共同連結的構造為何？","answer":"Tubulin／微管","explanation":"Colchicine：Tubulin／微管。","type":"choice","choices":["Nicotinic ACh receptor","Tubulin／微管","DNA Topoisomerase","病毒 Protease"],"aliases":[],"memory":null,"marked":true,"drug_ids":["d6-colchicine"],"learning_point":"colchi_worm_compare"},{"id":"d6-colchicine--colchi_griseo","chapter":"6","section":2,"row":1,"sources":[["6",2,1]],"facet":"特徵","prompt":"Colchicine與 Griseofulvin 的微管比較，哪項正確？","answer":"同與 Tubulin 連結，但結合位點不同","explanation":"Colchicine：同與 Tubulin 連結，但結合位點不同。","type":"choice","choices":["Colchicine 是 Ergosterol 膜孔藥","同與 Tubulin 連結，但結合位點不同","兩者都只抑 DNA gyrase","完全共用同一位點且只穩定微管"],"aliases":[],"memory":null,"marked":true,"drug_ids":["d6-colchicine"],"learning_point":"colchi_griseo"}],"memories":[{"id":"histamine","chapter":"1","kind":"對照","title":"H1／H2／H3、H4","line":"1 接 q；2 接 s；3、4 接 i。","detail":"先把受體接到 G protein，再推下游：q→Ca²⁺↑、s→cAMP↑、i→cAMP↓。","examples":"H1：過敏／平滑肌；H2：胃酸；H3：突觸前抑制。","limit":"是訊號對照，不用來猜藥名。","source":null},{"id":"h1","chapter":"1","kind":"機轉","title":"抗過敏與暈車分開記","line":"第一代進腦：會睏，也能處理暈車。","detail":"第二代較不進中樞，因此通常較少鎮靜，但也不能直接替代第一代的暈車用途。","examples":"Diphenhydramine、Dimenhydrinate、Meclizine 對照 Loratadine、Fexofenadine。","limit":"第二代仍可能嗜睡，Cetirizine 即需留意。","source":null},{"id":"serotonin","chapter":"1","kind":"對照","title":"5-HT3 與 5-HT4","line":"3 是通道；4 推腸道。","detail":"5-HT3 為離子通道；阻斷可止吐／降低部分腸道反應。5-HT4 agonism 促 ACh 釋放與腸蠕動。","examples":"Alosetron：3 antagonist；Prucalopride：4 agonist。","limit":"3／4 是受體亞型；不要把所有止吐藥都歸成 5-HT3 antagonist。","source":null},{"id":"setron","chapter":"1","kind":"字根","title":"-setron","line":"看到 -setron，先接到 5-HT3 blockade。","detail":"用共同字尾收一組，再記個別用途。","examples":"Ondansetron／Granisetron／Dolasetron：止吐；Alosetron：腸道。","limit":"共同機轉不代表相同適應症；Alosetron 要留意缺血性結腸炎。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"triptan","chapter":"1","kind":"字根","title":"-triptan","line":"Triptan → 5-HT1 → 急性偏頭痛。","detail":"把受體與血管收縮接起來，便能帶出冠心病／心絞痛限制。","examples":"Sumatriptan、Almotriptan、Frovatriptan、Zolmitriptan。","limit":"這組是急性處置，不把它直接記成偏頭痛預防藥。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"raas","chapter":"1","kind":"字根","title":"-pril 與 -sartan","line":"pril 擋 ACE；sartan 擋 AT1。","detail":"ACE 也分解 Bradykinin，所以 ACEI 的乾咳／血管性水腫可由機轉推出。","examples":"Captopril／Enalapril／Lisinopril；Losartan／Valsartan。","limit":"ARB 的咳嗽／血管性水腫較少，並非零；兩組都留意高血鉀及孕期禁用。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"leukotriene","chapter":"1","kind":"對照","title":"阻合成 vs. 阻受體","line":"Zileuton 阻生成；-lukast 擋受體。","detail":"先放在 AA→5-LO→LT→CysLT1 的同一條路徑上，比硬背音譯有效。","examples":"Zileuton：5-LO；Montelukast／Zafirlukast：CysLT1。","limit":"是控制／預防藥，不能取代急性快速救援。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"pda","chapter":"1","kind":"機轉","title":"動脈導管開與關","line":"補 PG 開；抑 PG 關。","detail":"Alprostadil 補 PGE1 維持開放；Indomethacin／Ibuprofen 抑 COX、減 PG，促關閉。","examples":"Alprostadil ↔ Indomethacin／Ibuprofen。","limit":"是導管方向對照；胎兒提早關閉與出生後治 PDA 是不同情境。","source":null},{"id":"steroid","chapter":"2","kind":"對照","title":"選 Steroid 先分兩種效力","line":"Dexamethasone 抗炎強；Fludrocortisone 留鹽強。","detail":"把 Glucocorticoid 與 Mineralocorticoid 畫成兩個軸，就不會把「很強」當萬用答案。","examples":"Hydrocortisone 生理替代；Fludrocortisone 補 Aldosterone。","limit":"Dexamethasone／Betamethasone 幾乎無留鹽作用，不能充分補 Aldosterone。","source":null},{"id":"wall","chapter":"3","kind":"路徑","title":"細胞壁的三個位置","line":"MurA 做原料；PBP 做交聯；Vanco 抓尾端。","detail":"先記步驟，再放藥，避免把所有細胞壁藥都寫成同一靶點。","examples":"Fosfomycin→MurA；β-lactams→PBP；Vancomycin→D-Ala-D-Ala。","limit":"三者同樣傷細胞壁，直接作用位置不同。","source":null},{"id":"beta","chapter":"3","kind":"字根","title":"β-lactam 藥名家族","line":"-cillin／cef-／-penem，先辨家族再看範圍。","detail":"這三個線索分別連到 Penicillin／Cephalosporin／本表的 Carbapenems。","examples":"Amoxicillin；Cefazolin；Imipenem。","limit":"同字尾不保證同抗菌譜：Ertapenem 不可靠抗綠膿，Ceftaroline 可抗 MRSA。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"ribosome","chapter":"3","kind":"對照","title":"兩個 30S 家族","line":"AG 誤讀；Tetra 擋 tRNA 進站。","detail":"Aminoglycosides 不可逆結合 30S，可誤讀 mRNA；Tetracyclines 可逆阻 Aminoacyl-tRNA 進 A site。","examples":"Gentamicin／Amikacin 對照 Doxycycline／Tetracycline。","limit":"-mycin 不能判斷核糖體位置：Gentamicin 與 Erythromycin 就不同。","source":null},{"id":"folate","chapter":"3","kind":"路徑","title":"SMX 與 TMP 的序列阻斷","line":"SMX 擋上游合成；TMP 擋下游還原。","detail":"PABA→DHPS→DHF→DHFR→THF；將兩個藥放回路徑，比交換酵素名更不易錯。","examples":"SMX→DHPS；TMP→DHFR。","limit":"MTX 也抑 DHFR，但不是因此就有相同用途或毒性。","source":null},{"id":"elimination","chapter":"3","kind":"對照","title":"排除途徑用例外串起來","line":"多數腎排，例外另外成組。","detail":"非腎重點：Nafcillin→膽汁、Doxycycline→膽汁／糞、Moxifloxacin→非腎。雙路：Ceftriaxone→腎＋膽汁。","examples":"另跨章對照 Fluconazole 原形腎排、Benzbromarone 主要膽汁。","limit":"這是表中例外清單；肝代謝與最後從尿／糞排出不是同一問題。","source":null},{"id":"aspirin","chapter":"4","kind":"機轉","title":"Aspirin 與血小板","line":"不可逆，加上血小板無核。","detail":"COX 被乙醯化後，血小板不能補造新 COX；因此抗血小板作用比血中藥物停留久。","examples":"低劑量 Aspirin→TXA2↓。","limit":"不把其他可逆 NSAIDs 一律套成同樣持續性。","source":null},{"id":"coxib","chapter":"4","kind":"字根","title":"-coxib","line":"coxib → COX-2；胃較少，心腎仍考。","detail":"連到 PGI2↓／血栓風險，及腎 PG↓／水鈉滯留。","examples":"Celecoxib、Etoricoxib、Parecoxib。","limit":"胃腸風險較少不是完全沒有；選擇性也不是無腎毒。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"napqi","chapter":"4","kind":"機轉","title":"Acetaminophen 過量","line":"毒物 NAPQI；耗 GSH；NAC 補回。","detail":"用三步因果記住代謝物與解毒藥，不用額外湊藥名諧音。","examples":"Acetaminophen→NAPQI；N-acetylcysteine→協助恢復 GSH。","limit":"NAC 是這個毒性路徑的配對，不是所有肝損傷的通用解毒藥。","source":null},{"id":"gout","chapter":"4","kind":"策略","title":"痛風分四個任務","line":"Colchicine 壓炎；XO 抑生成；URAT1 促排；Uricase 分解。","detail":"先回答藥物在處理「發炎、生成、再吸收、既有尿酸」哪一段。","examples":"Allopurinol／Febuxostat；Probenecid；Rasburicase／Pegloticase。","limit":"Colchicine 不直接降尿酸；促排尿酸要留意尿酸結石。","source":null},{"id":"leucovorin","chapter":"5","kind":"對照","title":"同一個 Leucovorin 的兩面","line":"5-FU 加強封鎖；MTX 繞道救援。","detail":"5-FU：穩定 TS 複合體；MTX：補還原型葉酸，繞過 DHFR。","examples":"Leucovorin 對 5-FU 是增效，對高劑量 MTX 是 rescue。","limit":"不能只記「葉酸＝解毒」，那會把 5-FU 方向記反。","source":null},{"id":"folf","chapter":"5","kind":"字母","title":"FOLFOX／FOLFIRI","line":"OX＝Oxaliplatin；IRI＝Irinotecan。","detail":"直接從組合名取成分；共同骨幹為 Leucovorin＋5-FU。","examples":"FOLFOX ↔ FOLFIRI。","limit":"縮寫只提示此處組合成分，不表示兩種附加藥機轉相同。","source":null},{"id":"acrolein","chapter":"5","kind":"機轉","title":"療效與毒性各一條","line":"PAM 傷癌；Acrolein 傷膀胱；MESNA 收 Acrolein。","detail":"將抗癌交聯與尿路毒性拆開，便能解釋 MESNA 為何不是救回腫瘤。","examples":"Cyclophosphamide／Ifosfamide→出血性膀胱炎。","limit":"MESNA 主要保護尿路，不是全身化療毒性的通用解毒劑。","source":null},{"id":"topo","chapter":"5","kind":"對照","title":"Topo I／II","line":"I 單股、II 雙股；-tecan 歸 I。","detail":"本表 Irinotecan／Topotecan 抑 Topo I；Etoposide／Doxorubicin 抑 Topo II。","examples":"Irinotecan→SN-38→UGT1A1 去活化。","limit":"-tecan 是本表兩藥的辨識線索；毒性仍要各自記。","source":null},{"id":"organ","chapter":"5","kind":"配對","title":"心與肺各放一組","line":"-rubicin 配心；Bleomycin 配肺。","detail":"Anthracyclines 累積心毒，Dexrazoxane 配心臟保護；Bleomycin 累積肺毒／纖維化。","examples":"Doxorubicin／Daunorubicin／Epirubicin／Idarubicin。","limit":"不要將 Dexrazoxane 誤配 Bleomycin；各 Anthracycline 程度仍有差異。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"microtubule","chapter":"5","kind":"對照","title":"微管要能組，也要能拆","line":"Vinca 不給組；Taxane 不給拆。","detail":"微管是動態結構；抑聚合與抑解聚方向不同，都會使有絲分裂停滯。","examples":"Vincristine／Vinblastine／Vinorelbine；Paclitaxel／Docetaxel。","limit":"不要把「穩定微管」誤當成讓細胞正常分裂。","source":null},{"id":"fungal","chapter":"6","kind":"路徑","title":"真菌：膜、壁、核酸","line":"Azole 阻造膜；Ampho 傷舊膜；-fungin 擋壁；5-FC 變 5-FU。","detail":"以真菌的構造分抽屜，先分作用位置，再記分布和毒性。","examples":"Azoles／Amphotericin B／Echinocandins／Flucytosine。","limit":"-azole 太廣，不能凡含 azole 都判抗黴菌；Metronidazole 是反例。","source":null},{"id":"hiv","chapter":"6","kind":"路徑","title":"HIV 藥跟著生命週期放","line":"進入→反轉錄→整合→成熟。","detail":"Maraviroc／Enfuvirtide→NRTI、NNRTI→Raltegravir→Darunavir／Ritonavir。","examples":"-navir：本表 HIV PI；-tegravir：Integrase inhibitor。","limit":"Ritonavir 低劑量可只作 Booster；不是所有 -vir 都是同一機轉。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"influenza","chapter":"6","kind":"時間軸","title":"流感三個步驟","line":"M2 擋拆殼；Baloxavir 擋轉錄；-amivir 擋釋出。","detail":"把病毒流程由前往後排，最容易避免把 Oseltamivir 寫成 RNA synthesis inhibitor。","examples":"Amantadine／Rimantadine；Baloxavir；Oseltamivir／Zanamivir／Peramivir。","limit":"M2 組僅 A，且抗藥性重要；Neuraminidase 組對 A＋B。","source":"https://www.kegg.jp/kegg/drug/br08333.html"},{"id":"purine","chapter":"7","kind":"對照","title":"MMF 與 Leflunomide","line":"MMF 減 GMP；Leflunomide 減 Pyrimidine。","detail":"把酵素名各掛到產物：IMPDH→GMP，DHODH→Pyrimidine／UMP。","examples":"Mycophenolic acid→IMPDH；Teriflunomide→DHODH。","limit":"兩者都抑淋巴球增殖，不代表核酸路徑相同。","source":null},{"id":"calcineurin","chapter":"7","kind":"對照","title":"結合蛋白 ≠ 下游靶點","line":"CsA 找 Cyclophilin；Tacro 與 Siro 找 FKBP；Tacro 抑 Calcineurin，Siro 抑 mTOR。","detail":"將「先結合誰」與「最後抑誰」分兩欄；IL-2 的生成與對 IL-2 的反應也分開。","examples":"CsA／Tacrolimus：IL-2 生成↓；Sirolimus：IL-2 下游增殖↓。","limit":"Tacrolimus 雖是 -rolimus，仍抑 Calcineurin；別只按字尾猜成 mTOR。","source":null},{"id":"mab","chapter":"7","kind":"字根","title":"既有 -mab 人源化線索","line":"o 鼠、xi 嵌合、zu 人源化、u 全人。","detail":"只用來整理本表的既有名稱；來源比例提高，免疫原性通常下降。","examples":"Infliximab／Rituximab：xi；Tocilizumab：zu；Adalimumab：u。","limit":"不適用所有新式抗體命名；Fully human 仍可能有 Anti-drug antibodies。","source":"https://www.who.int/teams/health-product-and-policy-standards/inn/stembook"},{"id":"cd","chapter":"7","kind":"配對","title":"常考的 CD 靶點","line":"3 是 T；20 是 B；25 是 IL-2Rα；52 範圍較廣。","detail":"先把細胞／受體放對，再掛藥名，避免所有抗體混成同一種免疫抑制。","examples":"OKT3→CD3；Rituximab→CD20；Basiliximab→CD25；Alemtuzumab→CD52。","limit":"CD52 不只 T／B；此句只幫本表藥物辨識，不是完整細胞表現圖。","source":null},{"id":"checkpoint","chapter":"7","kind":"對照","title":"一個占位，一個拆煞車","line":"Abatacept 占 B7，少共刺激；Ipilimumab 拆 CTLA-4 煞車。","detail":"前者 CTLA-4–Ig fusion 接在 APC 的 CD80／86；後者 Anti-CTLA-4 解除負向調控。","examples":"PD-1：Nivolumab／Pembrolizumab；PD-L1：Atezolizumab 等。","limit":"不能因名字都提 CTLA-4 就判成同方向。","source":null},{"id":"complement","chapter":"7","kind":"靶點","title":"補體不要硬湊字尾","line":"C5、C3、C1s、C5aR1，直接做靶點配對。","detail":"這組缺乏足夠簡潔可靠的共同藥名口訣，以四格對照較少多背一串。","examples":"Eculizumab／Ravulizumab→C5；Pegcetacoplan→C3；Sutimlimab→C1s；Avacopan→C5aR1。","limit":"Anti-C5 與 C5a receptor blockade 不是同一個步驟。","source":null},{"id":"worm","chapter":"8","kind":"對照","title":"寄生蟲：先分管與肌肉","line":"Meb／Alb 擋微管；Pyrantel 開 ACh；Praziquantel 進鈣再破皮。","detail":"把 β-tubulin、Nicotinic ACh receptor、Ca²⁺／外皮三個位置分開。","examples":"Mebendazole／Albendazole；Pyrantel pamoate；Praziquantel。","limit":"Praziquantel 還要記抗原暴露／免疫清除；不能只寫麻痺。","source":null},{"id":"malaria","chapter":"8","kind":"分期","title":"瘧疾的症狀、復發、傳播","line":"血裡管症狀；肝休眠管復發；生殖原體管傳播。","detail":"Chloroquine／Quinine／Artemisinin 重血液期；Primaquine 連到肝休眠型與生殖原體。","examples":"Primaquine：防 Vivax／Ovale 復發、減蚊媒傳播。","limit":"Malarone 有初期肝期作用，也不等於能清肝休眠型。","source":null},{"id":"amoeba","chapter":"8","kind":"分工","title":"阿米巴兩個位置","line":"Metronidazole 處理組織營養體；Diloxanide 補清腸腔 cyst。","detail":"把「病灶處理」與「腸腔殘留／帶原」分開，才能記住為何合用。","examples":"Metronidazole＋Diloxanide furoate。","limit":"Diloxanide 不能單獨取代急性腸外感染主力。","source":null}],"sections":{"1:0":{"title":"Histamine：來源、釋放與主要反應","rows":[["儲存／分布","\u003cbl>Mast cells、Basophils、胃 ECL cells 與神經元\u003c/bl>；\u003cbl>與 Heparin 結合儲於 granules\u003c/bl>","\u003cb>組織含量較高：肺、鼻腔黏膜、胃、十二指腸、皮膚\u003c/b>；\u003cbl>與 mast cell 密度相關\u003c/bl>","\u003cbl>周邊 Histamine 不易過 BBB\u003c/bl>；中樞由神經元自行合成"],["釋放方式","\u003cbl>IgE／抗原刺激 → Mast cell 脫顆粒\u003c/bl>；亦可被某些物質直接誘發釋放","\u003cbl>釋出 Histamine 是即時反應\u003c/bl>；後續招募免疫細胞與 Cytokines 可持續加重發炎","Bradykinin／Substance P 可促釋放；不能把所有化學釋放都當 IgE 過敏"],["\u003cbl>Triple response（H1）\u003c/bl>","小動脈擴張 → Redness；\u003cbl>血管通透性↑ → Wheal\u003c/bl>；感覺神經／軸突反射 → 周圍 Flare","\u003cb>紅點 → 膨疹／水腫 → 周圍紅暈\u003c/b>","大量全身釋放可至 Anaphylaxis／休克；\u003cb>Epinephrine\u003c/b> 為救命主力"],["\u003cg>NO／NOS\u003c/g>","\u003cg>L-arginine → NO＋L-citrulline；NO 活化 soluble guanylyl cyclase → cGMP↑ → PKG → 血管放鬆\u003c/g>","\u003cbl>另可開啟 Ca2+-dependent K+ channels → Hyperpolarization\u003c/bl>","eNOS／nNOS：平時表現、Ca2+ dependent；iNOS：發炎誘導型"]]},"1:1":{"title":"Histamine 受體：分布、訊息與作用","rows":[["H1","\u003cg>Gq → IP3／DAG↑、Ca2+↑\u003c/g>","\u003cbl>平滑肌／血管內皮／腦\u003c/bl>；\u003cbl>支氣管收縮、血管通透性↑、癢痛\u003c/bl>；\u003cbl>內皮 NO 可使血管放鬆\u003c/bl>","第一代 H1 antagonist 可進 CNS，故可鎮靜／治暈車"],["H2","\u003cg>Gs → cAMP↑\u003c/g>","胃黏膜：胃酸↑；心臟：輕度正性作用；血管平滑肌放鬆","H2 antagonist 用於抑制胃酸；與 H1 的抗過敏用途分開"],["H3","\u003cg>Gi → cAMP↓；突觸前抑制傳遞物釋放\u003c/g>","腦／神經末梢；\u003cbl>調節清醒、認知與神經傳遞\u003c/bl>","Pitolisant 解除抑制 → Histamine 釋放↑、清醒度↑"],["H4","\u003cg>Gi；免疫細胞趨化／Cytokine 調控\u003c/g>","Mast cells、Eosinophils 等；發炎與趨化","H4 治療概念勿與臨床 H1 抗過敏藥混淆"]]},"1:2":{"title":"抑制 Histamine 釋放","rows":[["Cromolyn sodium\n\u003cg>Nedocromil sodium\u003c/g>","\u003cbl>穩定 Mast cell，抑制脫顆粒及 Histamine 釋放\u003c/bl>","\u003cg>預防氣喘；不能解除已發生的支氣管痙攣\u003c/g>","\u003cbl>腸胃吸收差，預防用途以吸入為主\u003c/bl>"],["Theophylline","PDE inhibition → cAMP 分解↓","\u003cbl>共同使 Mast cell 內 \u003c/bl>\u003cbl>\u003cb>cAMP↑ → Histamine 釋放↓\u003c/b>\u003c/bl>","H2–Gs 亦可參與部分 Mast cells 的負回饋；不等於 H2 antagonist 可當氣喘救援藥"],["Albuterol","\u003cbl>β2–Gs → Adenylyl cyclase↑\u003c/bl>","\u003cbl>共同使 Mast cell 內 \u003c/bl>\u003cbl>\u003cb>cAMP↑ → Histamine 釋放↓\u003c/b>\u003c/bl>","H2–Gs 亦可參與部分 Mast cells 的負回饋；不等於 H2 antagonist 可當氣喘救援藥"]]},"1:3":{"title":"H1 antagonists：共通差異與第一代","rows":[["\u003cbl>第一代 vs. 第二代\u003c/bl>","\u003cg>第一代脂溶性較高、易過 BBB；第二代較不易過 BBB\u003c/g>","共同：過敏性鼻炎、蕁麻疹、結膜炎、止癢；多口服吸收佳／肝代謝","第一代：鎮靜＋抗膽鹼副作用；第二代通常較少嗜睡"],["\u003cg>Diphenhydramine\nDimenhydrinate\u003c/g>","第一代 H1 blockade；抗 Muscarinic；Diphenhydramine 另具局部麻醉作用","\u003cg>暈車／暈船\u003c/g>、助眠；\u003cg>Dimenhydrinate 是 Diphenhydramine 的鹽類\u003c/g>","鎮靜、口乾、尿滯留、便祕、視力模糊；駕駛能力下降"],["\u003cg>Cyclizine／Meclizine\u003c/g>","第一代 H1 blockade，具中樞／前庭作用","\u003cg>暈車、暈船\u003c/g>；第二代 H1 藥通常無法取代此用途","仍可能嗜睡"],["\u003cg>Chlorpheniramine\u003c/g>\nTripelennamine","第一代 H1 blockade；\u003cbl>可過 BBB\u003c/bl>","Chlorpheniramine 常見於感冒成藥；\u003cbl>抗過敏\u003c/bl>","鎮靜、抗膽鹼作用"],["Promethazine","\u003cbl>第一代中選擇性較差\u003c/bl>；H1、Muscarinic、α-adrenergic 等作用","\u003cg>止吐、暈車\u003c/g>；可具局部麻醉作用","\u003cg>強鎮靜；α blockade → 姿勢性低血壓\u003c/g>；抗膽鹼副作用"],["Doxylamine／Hydroxyzine","第一代 H1 blockade","Doxylamine：助眠；Hydroxyzine：止癢／鎮靜","CNS 與抗膽鹼副作用"]]},"1:4":{"title":"H1 antagonists：第二代與相關特例","rows":[["\u003cg>Loratadine／Desloratadine\nFexofenadine\u003c/g>","\u003cg>較低脂溶性、蛋白結合高／BBB P-glycoprotein 等限制中樞進入\u003c/g>","\u003cg>抗過敏、較少鎮靜；航空人員用藥例子中特別列出的三者\u003c/g>","\u003cg>不適合用來治暈車／暈船\u003c/g>"],["Cetirizine／Acrivastine","\u003cbl>第二代 H1 antagonist\u003c/bl>","\u003cbl>過敏性鼻炎等\u003c/bl>；Cetirizine 的臨床重點仍是 H1 blockade","Cetirizine 仍可能嗜睡；不能概括為第二代完全不會鎮靜"],["\u003cg>Cyproheptadine\u003c/g>","\u003cg>H1＋5-HT2 blockade\u003c/g>；亦有抗膽鹼作用","\u003cg>食慾↑\u003c/g>；\u003cbl>Serotonin syndrome 等\u003c/bl>","\u003cg>鎮靜\u003c/g>；與以 H1 為主的藥物用途不同"],["Terfenadine","\u003cbl>第二代 H1 antagonist\u003c/bl>","已停用；Fexofenadine 為相關活性代謝物","—"]]},"1:5":{"title":"H2／H3 antagonist：胃酸與清醒","rows":[["Cimetidine／Ranitidine\nFamotidine／Nizatidine","\u003cbl>阻斷胃壁細胞 H2–Gs → cAMP↓ → \u003c/bl>\u003cg>胃酸分泌↓\u003c/g>","\u003cg>Peptic ulcer\u003c/g>、GERD、Erosive esophagitis；亦可用於高分泌狀態／壓力性胃炎出血預防","\u003cbl>主要由腎排除\u003c/bl>；\u003cbl>腎功能差須留意\u003c/bl>。\u003cg>不易過 BBB\u003c/g>，中樞作用少，不影響胃排空"],["\u003cg>Famotidine：效力比較\u003c/g>","以 Cimetidine＝1；Ranitidine／Nizatidine 約 4–10；Famotidine 約 20–50","\u003cg>Famotidine 效力較強，所需劑量較小\u003c/g>","H2 抑胃酸；\u003cbl>H1 抗過敏性鼻炎\u003c/bl>"],["Cimetidine：特徵毒性","\u003cg>抑制肝 CYP450；抗 Androgen receptor 作用\u003c/g>","\u003cbl>Warfarin、Propranolol 等代謝↓ → 藥物交互作用\u003c/bl>","\u003cbl>男性女乳、泌乳、精子數↓、可逆性性功能障礙\u003c/bl>"],["\u003cg>Pitolisant（Tiprolisant）\u003c/g>","\u003cg>H3 inverse agonist，功能上解除 H3 突觸前抑制 → Histamine↑\u003c/g>","\u003cg>Narcolepsy：促進清醒；不是助眠藥，也不是化療止吐藥\u003c/g>","—"]]},"1:6":{"title":"Kallikrein–Kinin：血管水腫用藥","rows":[["\u003cbl>Bradykinin／Kallidin\u003c/bl>","Kallikrein 切割 Kininogen 產生；\u0 tiation complex 形成","MRSA／VRE 等後線藥；\u003cbl>口服生體可用率佳\u003c/bl>","\u003cbl>Linezolid：血小板低下（停藥可回復）、Serotonin syndrome\u003c/bl>；\u003cbl>Tedizolid 相關風險較少\u003c/bl>","一般無須常規依肝／腎功能調劑量，仍須監測"],["Quinupristin–Dalfopristin","—","不重要；\u003cbl>Streptogramins 複方\u003c/bl>","—","—"]]},"3:15":{"title":"腸道與下泌尿道藥：分布決定用途","rows":[["\u003cbl>Fidaxomicin\u003c/bl>","抑制細菌 RNA polymerase 的 \u003cb>Transcription initiation\u003c/b>","\u003cbl>G+ 為主\u003c/bl>；\u003cg>CDI 首選例子\u003c/g>，腸內高濃度","\u003cg>全身吸收極少\u003c/g>\u003cbl>，全身毒性低\u003c/bl>；不是全身感染用藥","\u003cbl>主要留在腸道／糞便\u003c/bl>"],["\u003cbl>Rifaximin\u003c/bl>","\u003cbl>抑制 RNA synthesis／\u003c/bl>\u003cbl>\u003cb>Elongation\u003c/b>\u003c/bl>","腸道局部作用；旅行者腹瀉等","口服吸收很少；與全身作用的 Rifampin 區分","主要腸道／糞便"],["Metronidazole","厭氧菌／原蟲中還原 → 活性中間產物 → \u003cb>破壞 DNA\u003c/b>","厭氧菌、Bacterial vaginosis、Trichomonas／阿米巴；\u003cbl>全身吸收佳\u003c/bl>","可能肝毒性／神經毒性；\u003cbl>不能把它與 Fidaxomicin 一律視為不吸收\u003c/bl>","主要肝代謝，代謝物尿排"],["Nitrofurantoin","還原產生活性中間產物，傷害 DNA／RNA／蛋白","\u003cb>單純下 UTI\u003c/b>；不作全身感染／腎盂腎炎主力；綠膿無效","腎功能不佳時尿中效益與蓄積毒性需留意","\u003cb>腎排，在尿液中發揮作用\u003c/b>"],["Methenamine","\u003cb>酸性尿 pH \u003c5.5\u003c/b> 釋出 Formaldehyde","預防反覆下 UTI；不是活動性感染主要治療","\u003cbl>避免與 Sulfonamides 合用：不溶性結晶／結石\u003c/bl>","尿中作用"]]},"5:0":{"title":"化療與標靶：作用對象與共通反應","rows":[["\u003cbl>Chemotherapy\u003c/bl>","干擾 DNA／核酸合成或有絲分裂，主要傷害快速增殖細胞，但缺乏腫瘤專一性","血液腫瘤常以藥物作全身治療；實體腫瘤依分期與手術／放療等搭配","\u003cb>黏膜受傷 → 噁心嘔吐；\u003c/b>\u003cg>毛囊 → 掉髮；\u003c/g>\u003cb>骨髓 → 血球↓、感染↑\u003c/b>"],["小分子標靶（TKI）","小分子可進細胞抑制 Kinase，阻斷特定致癌訊號","-nib；依分子條件選藥","分子選藥條件與特徵毒性不同，不能直接套用所有化療的器官毒性"],["抗體標靶（mAb）","抗體多作用於胞外 target，阻斷特定致癌訊號","-mab；依分子條件選藥","分子選藥條件與特徵毒性不同，不能直接套用所有化療的器官毒性"],["\u003cbl>Immunotherapy\u003c/bl>","誘發免疫毒殺，或解除免疫煞車","透過免疫系統抗腫瘤","可有免疫相關毒性；不直接套用所有化療器官毒性"]]},"5:1":{"title":"Antimetabolites：分類與 6-MP 活化","rows":[["\u003cbl>6-Mercaptopurine（6-MP）\u003c/bl>","\u003cbl>\u003cb>Prodrug → HGPRT → TIMP\u003c/b>\u003c/bl>\u003cbl>，模擬 IMP／干擾 Purine 核苷酸合成 → DNA 合成↓\u003c/bl>","ALL；與嘌呤合成阻斷相連結","\u003cbl>TIMP 為活性代謝物，不是把 HGPRT 當抑制靶點\u003c/bl>"],["6-Thioguanine（6-TG）\n\u003cg>Fludarabine／Cladribine\u003c/g>","Purine analogs，干擾核酸合成","\u003cbl>主要為血液腫瘤藥物群\u003c/bl>","\u003cbl>Purine 組與 5-FU／Ara-C／Gemcitabine 的 Pyrimidine 組分開\u003c/bl>"],["\u003cbl>Cytarabine（Ara-C）\u003c/bl>\n\u003cbl>Gemcitabine\u003c/bl>","Pyrimidine analogs，經活化後干擾 DNA 合成","\u003cbl>Ara-C：AML\u003c/bl>；\u003cbl>Gemcitabine：肺／胰／乳癌等\u003c/bl>","以分類與常見用途辨別"],["\u003cbl>Hydroxyurea\u003c/bl>","抑制 Ribonucleotide reductase → Deoxyribonucleotide 供應↓","同時影響 Purine／Pyrimidine 相關 DNA 原料","\u003cbl>不是 Purine／Pyrimidine analog 本身\u003c/bl>"]]},"5:2":{"title":"5-FU vs. MTX：Leucovorin 的相反任務","rows":[["\u003cbl>5-Fluorouracil（5-FU）\u003c/bl>","\u003cbl>活性 FdUMP 抑制 \u003c/bl>\u003cbl>\u003cb>Thymidylate synthase（TS）\u003c/b>\u003c/bl>\u003cbl>，dUMP → dTMP↓，DNA 合成受阻\u003c/bl>","\u003cr>與 Leucovorin 合用：增強 5-FU 抗癌作用\u003c/r>；大腸直腸癌主力之一","Leucovorin 提供還原型葉酸，\u003cb>穩定 TS–FdUMP–5,10-methylene-THF 三元複合體\u003c/b>，不是補葉酸來抵銷 5-FU"],["FOLFOX","\u003cbl>共同骨幹：\u003c/bl>\u003cbl>\u003cb>Leucovorin（Folinic acid）＋5-FU\u003c/b>\u003c/bl>","\u003cb>＋Oxaliplatin\u003c/b>；CRC 合併治療","\u003cbl>Leucovorin 先／伴隨 5-FU 提供 Cofactor\u003c/bl>；勿把兩組中的 Platinum／Topo I 成分配錯"],["FOLFIRI","\u003cbl>共同骨幹：\u003c/bl>\u003cbl>\u003cb>Leucovorin（Folinic acid）＋5-FU\u003c/b>\u003c/bl>","\u003cb>＋Irinotecan\u003c/b>；CRC 合併治療","\u003cbl>Leucovorin 先／伴隨 5-FU 提供 Cofactor\u003c/bl>；勿把兩組中的 Platinum／Topo I 成分配錯"],["\u003cbl>Methotrexate（MTX）\u003c/bl>","Folate analog；\u003cbl>抑制 \u003c/bl>\u003cbl>\u003cb>Dihydrofolate reductase（DHFR）\u003c/b>\u003c/bl>\u003cbl>，DHF → THF↓，核酸合成不足\u003c/bl>","血液／實體腫瘤；\u003cr>高劑量 MTX 後給 Leucovorin rescue，降低正常細胞毒性\u003c/r>","\u003cbl>Leucovorin 是活化態 \u003c/bl>\u003cbl>\u003cb>Folinic acid\u003c/b>\u003c/bl>\u003cbl>，可繞過 DHFR 阻斷\u003c/bl>；\u003cbl>不是直接用普通 Folic acid 等同替代\u003c/bl>"],["\u003cbl>Leucovorin 對照\u003c/bl>","\u003cr>5-FU：增效；MTX：救援\u003c/r>","同一藥物，取決於被阻斷的核酸合成步驟","\u003cb>前者強化 TS 抑制；後者補回還原型葉酸，減少骨髓抑制等毒性\u003c/b>"]]},"5:3":{"title":"烷化劑：Cyclophosphamide／Acrolein／MESNA","rows":[["\u003cbl>Cyclophosphamide（CPA）\u003c/bl>","\u003cbl>\u003cb>Prodrug，需肝 CYP 活化\u003c/b>\u003c/bl>；\u003cbl>產生 Phosphoramide mustard 等代謝物\u003c/bl>","Lymphoma／Leukemia／Breast cancer；活性產物使 DNA Guanine N7 交聯，DNA 複製受阻","\u003cbl>\u003cb>Phosphoramide mustard（PAM）＝抗癌活性\u003c/b>\u003c/bl>\u003cb>；\u003c/b>\u003cbl>\u003cb>Acrolein＝尿路毒性\u003c/b>\u003c/bl>\u003cbl>，兩者任務不同\u003c/bl>"],["\u003cbl>\u003cb>Acrolein\u003c/b>\u003c/bl>","\u003cbl>\u003cb>Cyclophosphamide／Ifosfamide 的毒性代謝物\u003c/b>\u003c/bl>\u003cb>；接觸膀胱尿路上皮造成傷害\u003c/b>","\u003cb>出血性膀胱炎（Hemorrhagic cystitis）的關鍵原因\u003c/b>","不是主要抗癌成分；\u003cbl>不能把 PAM 與 Acrolein 對調\u003c/bl>"],["\u003cbl>\u003cb>MESNA\u003c/b>\u003c/bl>","\u003cb>含 Thiol 的尿路保護劑，結合／去毒 Acrolein 等尿中毒性物質\u003c/b>","\u003cbl>\u003cb>合用於 Cyclophosphamide／Ifosfamide，降低出血性膀胱炎\u003c/b>\u003c/bl>","不是讓腫瘤 DNA 修復的抗癌解毒劑，也不是所有化療毒性的通用保護藥"],["\u003cbl>Ifosfamide\u003c/bl>","\u003cbl>Cyclophosphamide 的類似物\u003c/bl>；\u003cbl>同為 Prodrug，活性物造成 DNA cross-links\u003c/bl>","睪丸癌及其他腫瘤","\u003cbl>\u003cb>同樣會出血性膀胱炎，與 MESNA 配對\u003c/b>\u003c/bl>"]]},"5:4":{"title":"烷化劑：BBB 與 Platinum 比較","rows":[["\u003cbl>Carmustine（BCNU）\u003c/bl>\n\u003cbl>Lomustine（CCNU）\u003c/bl>","Nitrosoureas，脂溶性／可穿 BBB，造成 DNA 損傷","\u003cb>腦瘤／Glioblastoma（GBM）\u003c/b>","與多數不易進 CNS 的藥物相比"],["\u003cbl>Temozolomide\u003c/bl>","可穿 BBB 的 Triazene／Methylating agent","\u003cb>GBM；\u003c/b>\u003cbl>\u003cb>是 Alkylating agent，但不是 Nitrosourea\u003c/b>\u003c/bl>","不能因相同腦瘤用途就判定結構同類"],["\u003cbl>Cisplatin（第一代）\u003c/bl>","Platinum coordination compound，與 DNA 共價結合形成交聯","睪丸、肺、卵巢、膀胱／泌尿道腫瘤","\u003cb>腎毒性＋周邊神經毒（手腳麻）\u003c/b>；噁心嘔吐"],["\u003cbl>Carboplatin（第二代）\u003c/bl>","同屬 Platinum／DNA cross-linking","肺／卵巢癌等","仍有骨髓、神經等毒性；\u003cbl>腎毒性通常較 Cisplatin 少\u003c/bl>"],["\u003cbl>Oxaliplatin（第三代）\u003c/bl>","同屬 Platinum／DNA cross-linking","\u003cb>CRC 一線組合 FOLFOX\u003c/b>；亦可胃癌","\u003cb>腎毒性較小，但仍有明顯周邊神經毒\u003c/b>"],["Chlorambucil／Melphalan\nDacarbazine","其他 Alkylating／Methylating agents","類別辨認","—"]]},"5:5":{"title":"Topoisomerase inhibitors：活化與代謝毒性","rows":[["Topo I vs. Topo II","Topo I：切單股 DNA；Topo II：切雙股 DNA；抑制後 DNA 複製／修復受阻","\u003cbl>Topo I：Irinotecan／Topotecan\u003c/bl>；\u003cbl>Topo II：Etoposide／Doxorubicin\u003c/bl>","機轉分類與器官毒性要分開配對"],["\u003cbl>Irinotecan（CPT-11）\u003c/bl>","\u003cbl>\u003cb>Prodrug → Carboxylesterase 活化成 SN-38\u003c/b>\u003c/bl>\u003cb>；\u003c/b>\u003cbl>\u003cb>UGT1A1 再將 SN-38 Glucuronidation 去活化\u003c/b>\u003c/bl>","Topo I inhibitor；CRC／FOLFIRI","\u003cbl>\u003cb>UGT1A1 活性低 → SN-38 暴露↑ → 腹瀉、Neutropenia\u003c/b>\u003c/bl>；注意 *28 等基因差異"],["\u003cbl>Camptothecin／Topotecan\u003c/bl>","\u003cbl>喜樹鹼類 Topo I inhibitors\u003c/bl>","\u003cbl>Topotecan：肺／卵巢／子宮頸癌\u003c/bl>；\u003cbl>Camptothecin 為此類原型\u003c/bl>","與 Topo II 抑制劑不同"],["\u003cbl>Etoposide（VP-16）\u003c/bl>","Epipodophyllotoxin／鬼臼來源；抑制 Topo II","淋巴瘤、肺／睪丸癌","\u003cbl>\u003cb>輸注太快 → 低血壓\u003c/b>\u003c/bl>\u003cb>；減慢速度可改善\u003c/b>；亦可 Leukopenia"]]},"5:6":{"title":"抗腫瘤抗生素：心臟 vs. 肺","rows":[["\u003cbl>Doxorubicin（DOX）\u003c/bl>\nAdriamycin／小紅莓","Anthracycline；抑 Topo II，並形成 ROS／鐵相關損傷","多種實體腫瘤；\u003cbl>\u003cb>Dexrazoxane 可提供心臟保護\u003c/b>\u003c/bl>","\u003cb>累積性心臟毒性，可能不可逆\u003c/b>；骨髓抑制、外滲嚴重組織壞死"],["Daunorubicin／Epirubicin\n\u003cbl>Idarubicin\u003c/bl>","Anthracyclines，與 ROS／DNA 損傷相關","\u003cbl>同組心毒性概念\u003c/bl>；\u003cbl>Dexrazoxane 的配對\u003c/bl>","累積劑量重要；不同成員程度有差，不把整組當完全等毒"],["\u003cbl>Bleomycin\u003c/bl>","自由基／氧化傷害 → DNA strand breaks","淋巴瘤、睪丸癌","\u003cbl>\u003cb>累積性肺毒／肺纖維化\u003c/b>\u003c/bl>；不是以「嚴重骨髓抑制」作典型配對；\u003cbl>無同樣的 Dexrazoxane 保護配對\u003c/bl>"]]},"5:7":{"title":"Anti-microtubule：聚合 vs. 解聚","rows":[["\u003cbl>Vincristine\u003c/bl>","Vinca alkaloids（長春花）：\u003cb>抑制微管聚合\u003c/b>，有絲分裂停滯","微管動態被阻斷，不是 Topoisomerase inhibition","\u003cbl>\u003cb>周邊神經毒\u003c/b>\u003c/bl>\u003cb>；\u003c/b>\u003cbl>\u003cb>Vincristine 尤突出\u003c/b>\u003c/bl>"],["\u003cbl>Vinblastine\u003c/bl>","Vinca alkaloids（長春花）：\u003cb>抑制微管聚合\u003c/b>，有絲分裂停滯","微管動態被阻斷，不是 Topoisomerase inhibition","\u003cbl>\u003cb>周邊神經毒\ "\u003cbl>-azole 是主力群，但各藥分布、CYP 與毒性不同\u003c/bl>"],["Triazoles","Fluconazole 等","代謝較慢、對人類 Sterol 合成影響通常較少","\u003cbl>-azole 是主力群，但各藥分布、CYP 與毒性不同\u003c/bl>"],["Azoles 共通","\u003cbl>抑 Ergosterol 合成\u003c/bl>；\u003cg>主要針對 Yeasts：Candida／Cryptococcus\u003c/g>；新藥擴大 Mold 範圍","口服吸收通常佳；\u003cbl>多為肝 CYP substrate＋inhibitor\u003c/bl>","\u003cg>肝毒性\u003c/g>\u003cbl>／藥物交互作用\u003c/bl>；Rifampin／Phenytoin 可降低 Azole 濃度，Azoles 可提高 Warfarin／部分 BZD 等濃度"],["Fluconazole","\u003cbl>Triazole\u003c/bl>；可進 CNS，與 Candida／Cryptococcus 配對","\u003cb>主要原形經腎排除\u003c/b>，是多數 Azoles 肝代謝概括的例外 \u003ca href=\"https://www.accessdata.fda.gov/drugsatfda_docs/label/2022/020090s052lbl.pdf\">[來源]\u003c/a>","可肝酵素異常／QT 變化、掉髮；\u003cbl>不作 Aspergillus 主力\u003c/bl>"],["Itraconazole","\u003cbl>Triazole\u003c/bl>；\u003cbl>肝代謝／CYP 交互作用\u003c/bl>","Yeasts 及適當其他真菌情境","\u003cb>心衰竭、腸胃不耐\u003c/b>；高血壓／低鉀／水腫等代謝反應"],["\u003cg>Voriconazole／Posaconazole\nIsavuconazole\u003c/g>","\u003cg>新 Triazoles，擴大至 Molds，特別 Aspergillus\u003c/g>","\u003cg>Vori-／Posa-／Isavu-\u003c/g>\u003cbl> 與擴大抗黴菌譜連結\u003c/bl>","\u003cbl>Voriconazole CYP 交互作用特別多\u003c/bl>，可幻覺／皮膚毒性；Isavuconazole 可縮短 QT，非所有 Azoles 都延長 QT \u003ca href=\"https://www.accessdata.fda.gov/drugsatfda_docs/label/2021/207500s006%2C207501s005lbledt.pdf\">[來源]\u003c/a>"]]},"6:1":{"title":"抗黴菌：膜破壞、細胞壁與表皮分布","rows":[["\u003cbl>Amphotericin B\u003c/bl>","\u003cbl>直接結合 \u003c/bl>\u003cbl>\u003cb>Ergosterol\u003c/b>\u003c/bl>\u003cbl>，形成膜通透性改變 → 真菌受損\u003c/bl>；\u003cbl>不靠阻斷 Ergosterol 生合成\u003c/bl>","廣效嚴重全身感染；\u003cb>口服不吸收，系統性治療需非口服\u003c/b>；CSF／玻璃體穿透差","\u003cbl>\u003cb>發熱／寒顫「抖抖針」、腎毒性、貧血（EPO↓）\u003c/b>\u003c/bl>；脂質／Liposomal 製劑可降低部分毒性"],["\u003cg>Terbinafine\u003c/g>","\u003cbl>抑制 Ergosterol 生合成\u003c/bl>；\u003cg>累積皮膚、指甲、脂肪\u003c/g>","表淺皮黴菌／Onychomycosis；主要肝 CYP 代謝","\u003cg>肝毒性／罕見嚴重肝損傷\u003c/g>；Rifampin 可降低、Cimetidine 可提高暴露"],["Caspofungin／Micafungin\nAnidulafungin","\u003cbl>Echinocandins：抑 β-1,3-glucan 形成 → 細胞壁受損\u003c/bl>","\u003cg>-fungin\u003c/g>；\u003cbl>不能有效口服、CSF 差、非主要腎清除\u003c/bl> itle":"HIV：Reverse transcriptase 與組合治療","rows":[["NRTIs\nTenofovir／Lamivudine／Emtricitabine","\u003cbl>核苷／核苷酸類似物，活化後作為假原料，抑 Reverse transcriptase／Chain elongation\u003c/bl>","\u003cb>組合治療骨幹\u003c/b>；\u003cbl>Tenofovir 為 Nucleotide analog\u003c/bl>；\u003cbl>部分亦治 HBV\u003c/bl>","\u003cbl>多數交互作用少，腎排重要\u003c/bl>；\u003cg>抗藥一般較 NNRTI／PI 慢\u003c/g>。\u003cbl>舊藥可能傷 Mitochondrial DNA polymerase-γ → 肌病、乳酸中毒等\u003c/bl>"],["NNRTIs\nDoravirine／Rilpivirine","\u003cbl>非核酸類似物\u003c/bl>；結合 RT 的疏水口袋，非競爭性改變酵素構型","HIV-1，不適用 HIV-2；不需被誤認成核酸原料","\u003cbl>肝代謝\u003c/bl>、\u003cg>CYP 交互作用較多\u003c/g>；較易因 Binding pocket 突變抗藥；\u003cg>半衰期相對較長\u003c/g>；皮疹、肝炎"],["\u003cbl>組合治療／Tenofovir\u003c/bl>","典型組合：2 NRTIs＋NNRTI／PI／INSTI 之一，以不同步驟壓制病毒","\u003cbl>\u003cb>Tenofovir 可治 HIV／HBV，不是 HPV\u003c/b>\u003c/bl>","NRTI 安全性較佳不等於絕無毒性；\u003cbl>Tenofovir 仍可有腎／骨風險\u003c/bl>"]]},"6:5":{"title":"HIV：蛋白成熟、進入與基因整合","rows":[["\u003cbl>Protease inhibitors（PI）\u003c/bl>\nDarunavir；Ritonavir","抑 Viral aspartyl protease 切割 Gag／Pol polyprotein → 病毒蛋白成熟受阻","製造一條長 Polyprotein 後需切割才有功能；\u003cbl>抑 Protease 不是「替病毒保存更多功能蛋白」\u003c/bl>","\u003cbl>CYP3A4 肝代謝／抑制 → 交互作用、肝毒性\u003c/bl>；GI、Insulin resistance／Lipodystrophy"],["Ritonavir／Cobicistat（Booster）","低劑量抑代謝，延長其他主藥半衰期／提高濃度","與直接抗病毒主藥的任務區分","主要風險是被放大的 CYP 交互作用"],["\u003cbl>Maraviroc\u003c/bl>","\u003cbl>阻 Host CCR5，從進入細胞的步驟阻斷\u003c/bl>","從進入細胞的步驟阻斷；與 RT／PI 作用不同","\u003cbl>Maraviroc 的靶點在宿主受體，不在病毒 Polymerase\u003c/bl>"],["Enfuvirtide","作用 gp41，阻 Fusion","從進入細胞的步驟阻斷；與 RT／PI 作用不同","靶點為病毒 gp41，與宿主 CCR5 blockade 分開"],["INSTIs\nRaltegravir","抑 Integrase strand transfer，阻止 Viral DNA 與 Host DNA 形成整合鍵結","\u003cbl>阻斷基因體整合\u003c/bl>；不同於直接抑 RT 生成 DNA","相較某些 CYP 型藥交互作用少；Raltegravir 主要 UGT1A1 Glucuronidation，仍有個別差異"]]},"6:6":{"title":"Influenza：脫殼 vs. 轉錄 vs. 釋出","rows":[["\u003cbl>Amantadine／Rimantadine\u003c/bl>","M2 proton channel blockers → 病毒 Uncoating 受阻","\u003cb>只對 Influenza A\u003c/b>；抗藥性使其非一般流感治療主力","\u003cbl>Amantadine 神經毒性較明顯、原形腎排\u003c/bl>；Rimantadine 主要肝代謝"],["Oseltamivir（克流感）","Sialic acid 相關類似物，抑 \u003cb>Neuraminidase → 新病毒釋出↓\u003c/b>","Influenza A＋B；Esterase 活化的 Prodrug，口服吸收較佳","\u003cb>不是 RNA synthesis inhibitor\u003c/b>；主要腎排活性物；GI 不耐／頭痛，無主要 CYP 交互作用"],["\u003cbl>Zanamivir／Peramivir\u003c/bl>","\u003cbl>同為 Neuraminidase inhibitors，抑病毒釋出\u003c/bl>","A＋B；\u003cbl>\u003cb>Zanamivir 吸入，Peramivir IV\u003c/b>\u003c/bl>\u003cbl>，口服吸收差\u003c/bl>","與 Oseltamivir 的機轉相同，藥物可達性不同"],["Baloxavir marboxil","Prodrug → Baloxavir acid；抑 Cap-dependent endonuclease → Viral RNA transcription↓","阻「複製／轉錄」，非 Neuraminidase 釋出步驟；半衰期約 80 h，可單次用藥","乳品／Ca、Fe、Mg 等多價陽離子螯合 → 吸收↓"],["Favipiravir","抑 Viral RNA polymerase","抑病毒 RNA 複製","—"]]},"6:7":{"title":"SARS-CoV-2：核酸類似物 vs. PI","rows":[["Remdesivir","Adenosine analog prodrug，抑 RdRp → Viral RNA replication↓","\u003cb>IV\u003c/b>；與口服 Protease inhibitor 對照","肝酵素異常；不是 Neuraminidase inhibitor"],["\u003cg>Nirmatrelvir＋Ritonavir\nPaxlovid\u003c/g>","Nirmatrelvir：直接抑 Viral protease；Ritonavir：抑 CYP3A 提高主藥濃度","\u003cb>口服\u003c/b>；兩成分各有任務，不能把 Ritonavir 當此組的主要 SARS-CoV-2 target inhibitor","\u003cg>交互作用多\u003c/g>；\u003cbl>Ritonavir 可有肝毒性\u003c/bl>"],["Molnupiravir／Ensitrelvir","—","不重要；Ensitrelvir 屬口服 PI","—"]]},"7:0":{"title":"免疫抑制：基因表現與核酸合成","rows":[["Glucocorticoids\nPrednisone／Prednisolone／Dexamethasone","GR 結合後入核，調控轉錄，抑制 NF-κB 等發炎路徑 → Cytokines／免疫反應↓","全域抑制；可與其他免疫抑制劑合用降低個別劑量","感染風險；Lymphopenia；血 Neutrophils 可短暫↑，但移行／發炎功能仍受抑制"],["Mycophenolate mofetil（MMF）","Prodrug → Mycophenolic acid；\u003cbl>\u003cb>抑 IMPDH → IMP 轉 GMP 的 De novo Guanosine 合成↓\u003c/b>\u003c/bl>","較偏 T／B cells 增殖抑制；器官移植、Steroid-refractory GVHD、Lupus nephritis","\u003cbl>GI disturbance、可逆 Myelosuppression\u003c/bl>；\u003cbl>與 Leflunomide 的 Pyrimidine 靶點不同\u003c/bl>"],["\u003cbl>Leflunomide／Teriflunomide\u003c/bl>","前者為 Prodrug；\u003cbl>活性 Teriflunomide \u003c/bl>\u003cbl>\u003cb>抑 DHODH → Pyrimidine／UMP 合成↓\u003c/b>\u003c/bl>\u003cbl>，G1 arrest\u003c/bl>","T cell 增殖／B cell 自體抗體↓；\u003cbl>RA，Teriflunomide 另與 MS 相關\u003c/bl>；活性物半衰期約 19 天","肝毒性、腹瀉、可逆落髮；長半衰期意味作用／不良 <script>(function(root){
  'use strict';
  function normalize(value) {
    return String(value ?? '').normalize('NFKC').toLowerCase()
      .replaceAll('β','beta').replaceAll('α','alpha').replaceAll('γ','gamma')
      .replace(/[^\p{L}\p{N}]/gu,'');
  }
  function isCorrect(q,value) {
    if(q.type==='choice')return String(value)===q.answer;
    const n=normalize(value);
    return !!n && [q.answer,...(q.aliases||[])].some(a=>normalize(a)===n);
  }
  function shuffle(items,rng=Math.random) {
    const out=[...items];
    for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
    return out;
  }
  function selectQuestions(questions,records,opts={},rng=Math.random) {
    let pool=questions.filter(q=>(opts.chapters||[]).includes(q.chapter)
      && (!opts.kind||opts.kind==='all'||q.type===opts.kind)
      && (!opts.facet||opts.facet==='all'||q.facet===opts.facet)
      && (opts.scope!=='marked'||q.marked)
      && (opts.scope!=='fresh'||!records[q.id]?.attempts)
      && (opts.source!=='wrong'||['wrong','skipped'].includes(records[q.id]?.status))
      && (opts.source!=='starred'||records[q.id]?.starred));
    const groups={};
    for(const q of shuffle(pool,rng)) (groups[q.chapter]??=[]).push(q);
    const rank=q=> {
      const r=records[q.id];
      if(opts.order==='random') return 0;
      if(opts.order==='weak') return ['wrong','skipped'].includes(r?.status)?-10:!r?.attempts?0:5;
      return (q.marked?0:10)+(!r?.attempts?0:r.status==='correct'?3:1);
    };

   &&(opts.scope!=='review'||records[c.id]?.status==='review')&&(opts.scope!=='starred'||records[c.id]?.starred));

   &&Object.entries(s.records).every(([id,r])=>ids.has(id)&&validRecord(r))
   &&Array.isArray(s.history)&&s.history.every(h=>h&&Number.isInteger(h.total)&&h.total>0&&Number.isInteger(h.seen)&&h.seen>=0&&h.seen<=h.total&&Number.isFinite(h.at))

    &&new Set(session.queue).size===session.queue.length&&session.queue.every(id=>ids.has(id))
    &&Number.isInteger(session.index)&&session.index>=0&&session.index<session.queue.length

    &&new Set(session.revealed).size===session.revealed.length&&session.revealed.every(id=>session.queue.includes(id))

 }
 function listItems(deck){return deck.length?`<div class="drug-grid">${deck.map(c=>{const r=state.records[c.id]||{};return `<article class="drug-card"><div class="tags"><span class="tag">${esc(chapters.get(c.chapter).title)}</span></div><h2>${rich(c.name_rich)}</h2>${c.aliases.length?`<p class="drug-aliases">${esc(c.aliases.join('／'))}</p>`:''}<p class="drug-progress">${r.status==='known'?'記住了':r.status==='review'?'還不熟':r.views?'已翻看':'尚未翻看'}${r.starred?' · ★':''}</p>${btn('打開字卡 →','open-card','secondary',`data-id="${c.id}"`)}</article>`;}).join('')}</div>`:'<div class="empty"><h2>目前沒有符合條件的字卡</h2><p>可調整章節、搜尋詞或收藏範圍。</p></div>';}
 function memoryItems(){const term=C.normalize(memoryFilter.search),ms=DATA.memories.filter(m=>(memoryFilter.chapter==='all'||m.chapter===memoryFilter.chapter)&&(!term||C.normalize([m.title,m.line,m.detail,m.examples].join(' ')).includes(term)));return `<p class="hero-note">${ms.length} 張記憶卡</p><div class="memory-grid">${ms.map(m=>`<article class="memory-card"><span class="tag">${esc(chapters.get(m.chapter).title)} · ${esc(m.kind)}</span><h2>${esc(m.title)}</h2><div class="memory-line">${esc(m.line)}</div><p>${esc(m.detail)}</p><p class="memory-examples">${esc(m.examples)}</p><div class="limit">${esc(m.limit)}</div></article>`).join('')}</div>`;}
 function memory(){app.innerHTML=`<div class="page-intro"><div><div class="eyebrow">MEMORY LINKS</div><h1>記得住，也分得清。</h1></div></div><div class="toolbar">${chapterSelect('memory-chapter',memoryFilter.chapter)}<input type="search" name="memory-search" value="${esc(memoryFilter.search)}" placeholder="搜尋口訣／藥名" aria-label="搜尋口訣或藥名"></div><div id="memory-list">${memoryItems()}</div>`;}
 function render(){document.body.classList.toggle('studying',view==='study');nav();({home,study,result,drugs:list,review:list,memory}[view]||home)();}
 function exportProgress(){
  const bundle={format:'ph-block2-flashcards-backup',version:1,state,legacyQuizRaw:getRaw(LEGACY),importedLegacyRaw:getRaw(ARCHIVE)};
  const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='藥理Block2_字卡進度.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }
 async function importProgress(file){if(!file)return;try{
  const parsed=JSON.parse(await file.text());let incoming,archive;
  if(parsed.format==='ph-block2-flashcards-backup'&&parsed.version===1){incoming=parsed.state;archive=parsed.legacyQuizRaw||parsed.importedLegacyRaw;if(archive!==undefined&&archive!==null&&typeof archive!=='string')throw Error();}
  else if(parsed.mode==='flashcards')incoming=parsed;
  else {const legacy=globalThis.QuizCore.migrateState(parsed,DATA.questions);if(!legacy)throw Error();incoming=C.migrateLegacy(C.empty(),legacy,DATA.questions,DATA.cards);archive=JSON.stringify(parsed);}
  if(!C.validateState(incoming,DATA.cards))throw Error();
  if(!confirm('要以這份備份取代目前的字卡進度嗎？'))return;
  // Keep the original quiz storage intact; archive imported quiz history separately.
  if(archive){try{localStorage.setItem(ARCHIVE,archive);}catch{throw Error('archive');}}
  state=incoming;storageOK=true;persist();go('home');toast('已匯入字卡進度。');
 }catch{toast('備份格式無法辨識，原有進度未變更。');}finally{document.getElementById('import-file').value='';}}
 document.getElementById('import-file').addEventListener('change',e=>importProgress(e.target.files?.[0]));
 document.addEventListener('click',e=>{
  const target=e.target.closest('[data-action]');
  if(!target){if(view==='study'&&e.target.closest('[data-flip-zone]')&&!e.target.closest('a,button,details,input,select,textarea')&&!String(window.getSelection?.()||''))flip();return;}
  if(target.disabled)return;const {action,id}=target.dataset;
  if(action==='nav'){if(['home','drugs','review','memory'].includes(target.dataset.view))go(target.dataset.view);return;}
  if(action==='chapter'){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];render();}
  else if(action==='all-chapters'){selected=selected.length===DATA.chapters.length?[]:DATA.chapters.map(c=>c.id);render();}
  else if(action==='start')start();else if(action==='resume'&&state.session)go('study');
  else if(action==='pause')go('home');else if(action==='flip')flip();
  else if(action==='prev')move(-1);else if(action==='next')move(1);
  else if(action==='star'){const c=current();if(!c)return;const r=state.records[c.id]||{};state.records[c.id]={...r,starred:!r.starred};persist();render();}
  else if(action==='rate-review'||action==='rate-known'){const c=current();if(view!=='study'||!c||state.session.face!=='back')return;state.records[c.id]={...state.records[c.id],status:action==='rate-known'?'known':'review'};persist();move(1);}
  else if(action==='open-card'&&cards.has(id))start([id]);
  else if(action==='study-list')start(filteredList().map(c=>c.id));
  else if(action==='list-mode'){filters.mode=target.dataset.mode==='starred'?'starred':'review';render();}
  else if(action==='home')go('home');else if(action==='open-review')go('review');
  else if(action==='repeat'&&lastRound)start(lastRound.queue);
  else if(action==='export')exportProgress();else if(action==='import')document.getElementById('import-file').click();
  else if(action==='reset'&&confirm('要清除字卡進度與收藏嗎？')){state=C.empty();state.legacyMigrated=true;storageOK=true;persist();go('home');toast('字卡進度已清除。');}
 });
 document.addEventListener('change',e=>{const {name,value}=e.target;if(['order','scope','count'].includes(name)){settings[name]=name==='count'?Number(value):value;render();}else if(name==='list-chapter'){filters.chapter=value;render();}else if(name==='memory-chapter'){memoryFilter.chapter=value;render();}});
 document.addEventListener('input',e=>{if(e.target.name==='list-search'){filters.search=e.target.value;document.getElementById('card-list').innerHTML=listItems(filteredList());}else if(e.target.name==='memory-search'){memoryFilter.search=e.target.value;document.getElementById('memory-list').innerHTML=memoryItems();}});
 document.addEventListener('keydown',e=>{
  if(view!=='study'||e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,button,a,summary,[contenteditable="true"]'))return;
  if([' ','Enter','ArrowLeft','ArrowRight','1','2'].includes(e.key))e.preventDefault();
  if(e.key===' '||e.key==='Enter')flip();else if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);
  else if(['1','2'].includes(e.key)&&state.session?.face==='back'){const c=current();state.records[c.id]={...state.records[c.id],status:e.key==='1'?'review':'known'};persist();move(1);}
 });
 persist();render();
})();
</script>
</body>
</html>
